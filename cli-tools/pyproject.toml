[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devtools"
version = "0.1.0"
description = "DevTools CLI — gestiona artefactos de automatización IA (skills, agentes, prompts)"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.scripts]
devtools = "devtools.cli:main"
